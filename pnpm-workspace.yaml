# TDD packaging V3: @pandacss/dev 1.12.1 pins postcss 8.5.14 and browserslist
# 4.28.1 exactly; both have high-severity advisories (GHSA-r28c-9q8g-f849,
# GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g). Each override applies only to the
# vulnerable range. Remove them when a Panda release no longer pins those
# versions; the generated stylesheet must stay byte-identical.
overrides:
  'postcss@<8.5.23': ^8.5.28
  'browserslist@<4.28.7': ^4.29.3
