name: CI

# Documentation and governance gates run on every pull request and every push.
# PLAN P0 rows extend this workflow with source, build, packed-consumer,
# fixture, and security jobs; each job added becomes a required check.

on:
  pull_request:
  push:
  # TDD packaging V1: a daily run catches advisories published between changes.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  docs:
    name: Documentation gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Link check and acceptance-condition audit
        run: node scripts/check-docs.mjs

  clean-install:
    name: Clean install
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Assert pinned toolchain
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "pnpm@$(pnpm --version)" = "$(node -p "require('./package.json').packageManager")"
      - name: Install with lifecycle scripts and a frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Tracked files are unchanged
        run: git diff --exit-code && test -z "$(git status --porcelain --untracked-files=no)"

  policy:
    name: CI policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Policy detectors reject known violations
        run: node scripts/check-ci-policy.mjs --self-test
      - name: No heap override; Vitest retry is 0
        run: node scripts/check-ci-policy.mjs

  source-tests:
    name: Source tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Typecheck both packages
        run: pnpm typecheck
      - name: Both packages, retry 0
        run: pnpm test:source

  build:
    name: Build with default heap
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Assert pinned toolchain and no heap override
        run: |
          test "$(node --version)" = "v$(cat .node-version)"
          test "pnpm@$(pnpm --version)" = "$(node -p "require('./package.json').packageManager")"
          test -z "${NODE_OPTIONS:-}"
      - run: pnpm install --frozen-lockfile
      # TDD packaging K3: a bundler that drops a module directive fails the build.
      - name: Build both packages, including declarations
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v -o build-time.txt pnpm run build 2>&1 | tee build.log
          if grep -nE 'directive.*was ignored|was ignored.*directive|Module level directives' build.log; then
            echo "::error::A module-level directive was dropped by the build"
            exit 1
          fi
      - name: Record peak memory
        if: always()
        run: |
          limit_mb=$(node -p "Math.round(require('v8').getHeapStatistics().heap_size_limit / 1048576)")
          peak_kb=$(awk -F': ' '/Maximum resident set size/ {print $2}' build-time.txt)
          wall=$(awk -F': ' '/Elapsed \(wall clock\)/ {print $2}' build-time.txt)
          {
            echo "### Build memory"
            echo ""
            echo "| Node | Default V8 heap limit | Peak RSS (largest process) | Wall time |"
            echo "| :--- | :-------------------- | :------------------------- | :-------- |"
            echo "| $(node --version) | ${limit_mb} MiB | $((peak_kb / 1024)) MiB | ${wall} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-memory
          path: |
            build-time.txt
            build.log
      # TDD packaging R3: a second pack on this runner; the evidence packet
      # requires its content digests to equal the packed-consumer job's.
      - name: Pack again for the reproducibility check
        run: node scripts/inspect-packages.mjs --out artifacts/rebuild
      - uses: actions/upload-artifact@v4
        with:
          name: rebuild
          path: artifacts/rebuild/pack-report.json

  packed-consumer:
    name: Packed consumer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Exports match source entries
        run: node scripts/sync-exports.mjs --check
      - name: Stylesheet gate rejects known violations
        run: node packages/design-system/scripts/styles/check-css.mjs --self-test
      # The build runs the stylesheet gate on every published stylesheet.
      - run: pnpm run build
      - name: Inspector rejects known violations
        run: node scripts/inspect-packages.mjs --self-test
      - name: Pack and inspect both tarballs
        run: node scripts/inspect-packages.mjs --out artifacts/packages
      - name: Isolated consumers at both React peer boundaries
        run: node scripts/packed-consumer.mjs --packs artifacts/packages
      - name: Install Chromium for the browser verifier
        run: pnpm exec playwright install --with-deps chromium
      - name: Packed token stylesheets in a browser
        run: node scripts/browser-tokens.mjs --packs artifacts/packages
      - name: Packed components in a browser (layers, isolation, focus, forced colors)
        run: node scripts/browser-components.mjs --packs artifacts/packages
      - name: Packed ThemeProvider in a browser (SSR, hydration, isolation, strict CSP)
        run: node scripts/browser-theme.mjs --packs artifacts/packages
      - name: Import side effects of every public entry (strict CSP)
        run: node scripts/browser-imports.mjs --packs artifacts/packages
      - name: Next.js App Router consumer (server-safe and client-only entries)
        run: node scripts/nextjs-consumer.mjs --packs artifacts/packages
      # Evaluation only: Module Federation stays assess (TDD packaging F1-F9).
      - name: Federation share map rejects known violations
        run: node scripts/federation-share-map.mjs --self-test
      - name: Federation evaluation (host and remotes from tarballs)
        run: node scripts/federation-fixture.mjs --packs artifacts/packages
      # TDD packaging V1-V5. The fixtures above saved their lockfiles.
      - name: Supply-chain gates reject known violations
        run: |
          node scripts/security/audit.mjs --self-test
          node scripts/security/licenses.mjs --self-test
          node scripts/sbom.mjs --self-test
      - name: CycloneDX 1.7 SBOM per tarball
        run: node scripts/sbom.mjs --packs artifacts/packages
      - name: Licenses of the lockfile, the tarballs, and copied assets
        run: node scripts/security/licenses.mjs --packs artifacts/packages --out artifacts/packages/security
      - name: Advisories in the workspace and every fixture graph
        run: node scripts/security/audit.mjs --lockfiles artifacts/packages/lockfiles --out artifacts/packages/security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-packages
          path: |
            artifacts/packages/*.tgz
            artifacts/packages/*.json
            artifacts/packages/sbom/
            artifacts/packages/lockfiles/
            artifacts/packages/security/

  # TDD packaging V6: SLSA Build L2 provenance and SBOM attestations for the
  # tarballs the packed-consumer job verified. Only pushes to main are attested;
  # this job installs nothing, so the OIDC token never reaches dependency code.
  # The repository is public, so each attestation is also written to the
  # Sigstore public-good transparency log.
  attest:
    name: Provenance and SBOM attestations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: packed-consumer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packed-packages
          path: artifacts/packages
      - name: Locate tarballs and SBOMs
        id: files
        run: |
          echo "core_tgz=$(ls artifacts/packages/scnx-core-ui-*.tgz)" >> "$GITHUB_OUTPUT"
          echo "core_sbom=$(ls artifacts/packages/sbom/scnx-core-ui-*.cdx.json)" >> "$GITHUB_OUTPUT"
          echo "system_tgz=$(ls artifacts/packages/scnx-system-*.tgz)" >> "$GITHUB_OUTPUT"
          echo "system_sbom=$(ls artifacts/packages/sbom/scnx-system-*.cdx.json)" >> "$GITHUB_OUTPUT"
      - name: SLSA build provenance for both tarballs
        uses: actions/attest@v4.2.2
        with:
          subject-path: artifacts/packages/*.tgz
      - name: SBOM attestation for @scnx/core-ui
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.core_tgz }}
          sbom-path: ${{ steps.files.outputs.core_sbom }}
      - name: SBOM attestation for @scnx/system
        uses: actions/attest@v4.2.2
        with:
          subject-path: ${{ steps.files.outputs.system_tgz }}
          sbom-path: ${{ steps.files.outputs.system_sbom }}

  # TDD packaging R1-R5: the P0 evidence packet of this run. It runs after
  # every other job, also when one failed, and records every job's result.
  evidence:
    name: P0 evidence packet
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [docs, clean-install, policy, source-tests, build, packed-consumer, attest, storybook, chromatic, token-gate, governance]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - name: Architecture repository at main (R4)
        uses: actions/checkout@v4
        with:
          repository: anshacerbia2/scnehaux-architecture
          path: architecture
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # A missing artifact is recorded as missing evidence; the packet then fails.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: packed-packages
          path: artifacts/evidence-input/packed-packages
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rebuild
          path: artifacts/evidence-input/rebuild
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: token-report
          path: artifacts/evidence-input/token-report
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-memory
          path: artifacts/evidence-input/build-memory
      - name: Jobs of this run attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > artifacts/jobs.json
      - name: Evidence packet rejects known violations
        run: node scripts/evidence.mjs --self-test
      - name: Build, verify, and validate the packet
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/evidence.mjs --artifacts artifacts/evidence-input --jobs artifacts/jobs.json
          --architecture architecture --verify-attestations --out artifacts/evidence
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-evidence
          path: artifacts/evidence/p0-evidence.json

  # TDD packaging R2: the packet is attested like the tarballs, by a job that
  # installs nothing.
  evidence-attest:
    name: P0 evidence attestation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: p0-evidence
          path: artifacts/evidence
      - uses: actions/attest@v4.2.2
        with:
          subject-path: artifacts/evidence/p0-evidence.json

  storybook:
    name: Storybook tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # The preview loads the built CSS assets (ADR-UIP-WKS-001).
      - run: pnpm run build
      - name: Install Chromium for story tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Every story in Chromium, axe-core at error level
        run: pnpm test:stories
      - name: Static Storybook
        run: pnpm exec storybook build -o storybook-static --quiet
      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

  chromatic:
    name: Chromatic visual review
    # Chromatic keeps baselines per pushed commit; pull_request runs would
    # snapshot the same commit twice.
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - name: Static Storybook
        run: pnpm run build-storybook
      # Fails visibly until the CHROMATIC_PROJECT_TOKEN secret exists.
      - uses: chromaui/action@v18.10.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          exitZeroOnChanges: false
          autoAcceptChanges: main

  token-gate:
    name: Token gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # PLAN P0 row 4: every category is clean, so every finding blocks.
      - name: Validate tokens against STD-UIP-TKN-001
        run: node packages/design-system/scripts/tokens/check.mjs --report artifacts/token-report.json --blocking
      - name: Record token findings
        if: always()
        run: |
          node -e '
            const r = require("./artifacts/token-report.json");
            const rows = Object.entries(r.findingsByCategory)
              .map(([c, n]) => `| ${c} | ${n} | ${r.blockedCategories.includes(c) ? "blocking" : "report"} |`);
            console.log([
              "### Token gate",
              "",
              `${r.records.names} tokens; contrast cases ${r.contrast.cases}; normalized root ${r.normalizedRootHash.slice(0, 12)}`,
              "",
              "| Category | Findings | Gate |",
              "| :-- | --: | :-- |",
              ...rows,
            ].join("\n"));
          ' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: token-report
          path: artifacts/token-report.json

  governance:
    name: Central governance linter
    uses: anshacerbia2/scnehaux-architecture/.github/workflows/linter.yml@main
    with:
      target_dir: docs/designs
      governance_ref: main
