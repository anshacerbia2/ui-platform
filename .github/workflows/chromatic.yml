name: Chromatic

# TDD packaging C2 and ADR-UIP-WKS-001: Chromatic's visual review runs on push
# to every branch, as Chromatic recommends; pull_request events can lose
# baselines. The job name is a required check (C4).

on:
  push:

permissions:
  contents: read

jobs:
  chromatic:
    name: Chromatic visual review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # TurboSnap with a prebuilt Storybook needs its stats file (Chromatic,
      # TurboSnap setup: "include the --stats-json option").
      - name: Static Storybook with stats for TurboSnap
        run: pnpm run build-storybook --stats-json
      # Fails visibly until the CHROMATIC_PROJECT_TOKEN secret exists.
      - uses: chromaui/action@v18.10.1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          exitZeroOnChanges: false
          autoAcceptChanges: main
          # ADR-UIP-WKS-001: TurboSnap captures only affected stories and copies
          # the rest at 1/5 of a snapshot; the Free plan pauses testing at
          # 5,000 billed snapshots a month (128 per full build).
          onlyChanged: true
          # TDD packaging C2: the preview imports the built CSS from dist/, so
          # TurboSnap cannot trace the sources of that CSS; a change to any of
          # them rebuilds every story (Chromatic, "Trigger full rebuilds").
          externals: |
            packages/design-system/src/**/*.scss
            packages/design-system/tokens.config.json
            packages/design-system/styles.config.json
            packages/design-system/panda.config.ts
            packages/design-system/scripts/**
            packages/design-system/assets/**
